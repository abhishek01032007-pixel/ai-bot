<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Nova AI · Modern Intelligent Assistant</title>

<!-- Modern Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>

<!-- Marked & Highlight.js for Markdown & Syntax Highlighting -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" id="hljs-theme"/>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* LIGHT THEME (DEFAULT) & DARK THEME VARIABLES */
:root, [data-theme="light"] {
  --bg:#f8fafc;
  --bg-subtle:#ffffff;
  --surface:#ffffff;
  --surface-elevated:#f1f5f9;
  --surface-hover:#e2e8f0;
  --border:#e2e8f0;
  --border-subtle:#edf2f7;
  --border-focus:#4f46e5;
  --primary:#4f46e5;
  --primary-gradient:linear-gradient(135deg, #4f46e5, #6366f1);
  --primary-glow:rgba(79, 70, 229, 0.15);
  --cyan:#0284c7;
  --cyan-subtle:#e0f2fe;
  --emerald:#10b981;
  --text:#0f172a;
  --text-muted:#475569;
  --text-dim:#94a3b8;
  --user-bg:linear-gradient(135deg, #4f46e5, #4338ca);
  --user-text:#ffffff;
  --bot-card-bg:#ffffff;
  --shadow-sm:0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md:0 4px 14px -2px rgba(0, 0, 0, 0.06), 0 2px 6px -1px rgba(0, 0, 0, 0.04);
  --shadow-lg:0 12px 28px -4px rgba(0, 0, 0, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.03);
  --sidebar-w:290px;
}

[data-theme="dark"] {
  --bg:#07080b;
  --bg-subtle:#0d0f15;
  --surface:#12151f;
  --surface-elevated:#181c2a;
  --surface-hover:#202538;
  --border:#212638;
  --border-subtle:#181d2c;
  --border-focus:#6366f1;
  --primary:#6366f1;
  --primary-gradient:linear-gradient(135deg, #6366f1, #06b6d4);
  --primary-glow:rgba(99,102,241,0.25);
  --cyan:#06b6d4;
  --cyan-subtle:rgba(6,182,212,0.15);
  --emerald:#10b981;
  --text:#f8fafc;
  --text-muted:#94a3b8;
  --text-dim:#64748b;
  --user-bg:#161d2f;
  --user-text:#e2e8f0;
  --bot-card-bg:#12151f;
  --shadow-sm:0 1px 2px 0 rgba(0,0,0,0.4);
  --shadow-md:0 4px 16px rgba(0,0,0,0.5);
  --shadow-lg:0 12px 30px rgba(0,0,0,0.6);
}

@keyframes pulseSubtle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.95)}}
@keyframes waveAnim{0%,100%{height:4px}50%{height:15px}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeScale{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  height:100dvh;
  display:flex;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background-color .25s ease, color .25s ease;
}

/* SIDEBAR DRAWER */
.sidebar{
  width:var(--sidebar-w);
  height:100vh;
  background:var(--bg-subtle);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  transition:transform .28s cubic-bezier(0.16, 1, 0.3, 1), margin-left .28s cubic-bezier(0.16, 1, 0.3, 1);
  z-index:40;
  flex-shrink:0;
}
.sidebar.collapsed{
  margin-left:calc(-1 * var(--sidebar-w));
}

.sidebar-header{
  padding:18px 18px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border-subtle);
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:inherit;
}
.brand-icon{
  width:34px;
  height:34px;
  border-radius:10px;
  background:var(--primary-gradient);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  color:#fff;
  box-shadow:var(--shadow-sm);
}
.brand-name{
  font-size:15px;
  font-weight:700;
  letter-spacing:-.02em;
  color:var(--text);
}
.brand-badge{
  font-size:10px;
  padding:2px 7px;
  border-radius:6px;
  background:rgba(79, 70, 229, 0.08);
  color:var(--primary);
  border:1px solid rgba(79, 70, 229, 0.2);
  font-weight:700;
}

.btn-icon{
  width:32px;
  height:32px;
  border-radius:8px;
  background:transparent;
  border:1px solid transparent;
  color:var(--text-muted);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all .18s;
}
.btn-icon:hover{
  background:var(--surface-elevated);
  border-color:var(--border);
  color:var(--text);
}

.new-chat-container{
  padding:14px 16px 8px;
}
.new-chat-btn{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 14px;
  border-radius:10px;
  background:var(--surface-elevated);
  border:1px solid var(--border);
  color:var(--text);
  font-size:13.5px;
  font-weight:600;
  cursor:pointer;
  transition:all .2s;
  box-shadow:var(--shadow-sm);
}
.new-chat-btn:hover{
  background:var(--surface-hover);
  border-color:var(--primary);
  color:var(--primary);
  transform:translateY(-1px);
}
.kbd-hint{
  font-size:10px;
  font-family:'JetBrains Mono',monospace;
  background:var(--surface);
  border:1px solid var(--border);
  padding:2px 6px;
  border-radius:5px;
  color:var(--text-dim);
}

.chat-history-label{
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--text-dim);
  padding:14px 18px 6px;
}
.chat-history-list{
  flex:1;
  overflow-y:auto;
  padding:0 10px;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.chat-history-list::-webkit-scrollbar{width:4px}
.chat-history-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.history-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:9px 12px;
  border-radius:8px;
  cursor:pointer;
  transition:all .15s;
  color:var(--text-muted);
  font-size:13px;
  gap:8px;
}
.history-item:hover{
  background:var(--surface-elevated);
  color:var(--text);
}
.history-item.active{
  background:var(--surface-elevated);
  color:var(--primary);
  font-weight:600;
  border-left:3px solid var(--primary);
}
.history-title{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  flex:1;
}
.history-del-btn{
  opacity:0;
  background:transparent;
  border:none;
  color:var(--text-dim);
  cursor:pointer;
  padding:2px 6px;
  border-radius:4px;
  transition:all .15s;
}
.history-item:hover .history-del-btn{opacity:1}
.history-del-btn:hover{color:#ef4444}

.sidebar-footer{
  padding:14px 16px;
  border-top:1px solid var(--border-subtle);
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:11.5px;
  color:var(--text-dim);
}
.status-indicator{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:500;
}
.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--emerald);
  animation:pulseSubtle 2s infinite;
}
.clear-btn{
  background:transparent;
  border:none;
  color:var(--text-dim);
  cursor:pointer;
  font-size:11px;
  transition:color .15s;
}
.clear-btn:hover{color:#ef4444}

/* MAIN CHAT CONTAINER */
.main-content{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
  height:100vh;
  height:100dvh;
  position:relative;
  background:radial-gradient(circle at 50% 0%, rgba(79, 70, 229, 0.04), transparent 45%), var(--bg);
}

/* TOP NAVBAR */
.topbar{
  height:60px;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border-subtle);
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(16px);
  z-index:20;
  gap:12px;
}
[data-theme="dark"] .topbar {
  background:rgba(7,8,11,0.7);
}

.topbar-left{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}
.current-session-title{
  font-size:14px;
  font-weight:600;
  color:var(--text-muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:280px;
}

.topbar-right{
  display:flex;
  align-items:center;
  gap:10px;
}

/* Segmented Mode Switcher */
.mode-switch{
  display:flex;
  background:var(--surface-elevated);
  border:1px solid var(--border);
  padding:3px;
  border-radius:10px;
}
.mode-btn{
  display:flex;
  align-items:center;
  gap:6px;
  padding:5px 12px;
  border-radius:7px;
  border:none;
  background:transparent;
  color:var(--text-muted);
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  transition:all .18s;
}
.mode-btn.active{
  background:var(--surface);
  color:var(--text);
  box-shadow:var(--shadow-sm);
}
.mode-btn.active.turbo{color:var(--cyan);border-bottom:2px solid var(--cyan)}
.mode-btn.active.precision{color:var(--primary);border-bottom:2px solid var(--primary)}

/* Web Search Toggle */
.web-toggle{
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 12px;
  border-radius:10px;
  background:var(--surface-elevated);
  border:1px solid var(--border);
  color:var(--text-muted);
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  transition:all .2s;
  user-select:none;
}
.web-toggle:hover{
  border-color:var(--cyan);
  color:var(--text);
}
.web-toggle.active{
  background:var(--cyan-subtle);
  border-color:var(--cyan);
  color:var(--cyan);
}

/* Theme Switcher Toggle */
.theme-btn{
  width:34px;
  height:34px;
  border-radius:10px;
  background:var(--surface-elevated);
  border:1px solid var(--border);
  color:var(--text-muted);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all .18s;
}
.theme-btn:hover{
  background:var(--surface-hover);
  color:var(--text);
}

/* CHAT SCROLL AREA */
.chat-viewport{
  flex:1;
  overflow-y:auto;
  padding:28px 20%;
  scroll-behavior:smooth;
  min-height:0;
}
.chat-viewport::-webkit-scrollbar{width:5px}
.chat-viewport::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* WELCOME HERO */
.welcome-hero{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px 16px 20px;
  min-height:65vh;
  gap:18px;
}
.hero-orb{
  width:64px;
  height:64px;
  border-radius:20px;
  background:var(--primary-gradient);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  color:#fff;
  box-shadow:var(--shadow-md);
  position:relative;
}
.hero-orb::after{
  content:'';
  position:absolute;
  inset:-3px;
  border-radius:23px;
  background:var(--primary-gradient);
  opacity:.25;
  filter:blur(8px);
  z-index:-1;
}
.welcome-hero h1{
  font-size:26px;
  font-weight:800;
  letter-spacing:-.03em;
  color:var(--text);
}
.welcome-hero p{
  font-size:14px;
  color:var(--text-muted);
  max-width:440px;
  line-height:1.6;
}

.feature-cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  max-width:540px;
  width:100%;
  margin-top:10px;
}
.feature-card{
  background:var(--surface);
  border:1px solid var(--border);
  padding:14px 16px;
  border-radius:12px;
  text-align:left;
  cursor:pointer;
  transition:all .2s;
  display:flex;
  flex-direction:column;
  gap:4px;
  box-shadow:var(--shadow-sm);
}
.feature-card:hover{
  background:var(--surface-elevated);
  border-color:var(--primary);
  transform:translateY(-2px);
  box-shadow:var(--shadow-md);
}
.feature-card-title{
  font-size:13px;
  font-weight:700;
  color:var(--text);
  display:flex;
  align-items:center;
  gap:6px;
}
.feature-card-desc{
  font-size:12px;
  color:var(--text-muted);
}

/* MESSAGES */
.message-row{
  display:flex;
  gap:14px;
  margin-bottom:22px;
  animation:fadeScale .2s ease-out;
  max-width:820px;
  margin-left:auto;
  margin-right:auto;
  width:100%;
}
.message-row.user{
  flex-direction:row-reverse;
}

.avatar-badge{
  width:32px;
  height:32px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  flex-shrink:0;
  margin-top:2px;
  box-shadow:var(--shadow-sm);
}
.message-row.user .avatar-badge{
  background:var(--surface-elevated);
  border:1px solid var(--border);
  color:var(--text-muted);
}
.message-row.bot .avatar-badge{
  background:var(--primary-gradient);
  color:#fff;
}

.bubble-container{
  display:flex;
  flex-direction:column;
  gap:6px;
  max-width:calc(100% - 48px);
}
.message-row.user .bubble-container{
  align-items:flex-end;
}
.message-row.bot .bubble-container{
  align-items:flex-start;
  width:100%;
}

.chat-bubble{
  padding:14px 18px;
  border-radius:14px;
  font-size:14.2px;
  line-height:1.75;
  word-break:break-word;
  box-shadow:var(--shadow-sm);
}
.message-row.user .chat-bubble{
  background:var(--user-bg);
  color:var(--user-text);
  border-top-right-radius:4px;
  white-space:pre-wrap;
}
.message-row.bot .chat-bubble{
  background:var(--bot-card-bg);
  border:1px solid var(--border);
  color:var(--text);
  border-top-left-radius:4px;
  width:100%;
  box-shadow:var(--shadow-sm);
}

/* Bot Markdown Elements */
.chat-bubble p{margin-bottom:10px}
.chat-bubble p:last-child{margin-bottom:0}
.chat-bubble h1,.chat-bubble h2,.chat-bubble h3{color:var(--text);margin:14px 0 8px;font-weight:700}
.chat-bubble h1{font-size:18px}.chat-bubble h2{font-size:16px}.chat-bubble h3{font-size:14px}
.chat-bubble ul,.chat-bubble ol{margin-left:22px;margin-bottom:10px}
.chat-bubble li{margin-bottom:4px}
.chat-bubble a{color:var(--primary);text-decoration:none;border-bottom:1px dotted var(--primary);font-weight:500}
.chat-bubble a:hover{border-bottom-style:solid}
.chat-bubble blockquote{border-left:3px solid var(--primary);padding-left:12px;color:var(--text-muted);margin:10px 0;font-style:italic}
.chat-bubble table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13px}
.chat-bubble th,.chat-bubble td{border:1px solid var(--border);padding:8px 12px;text-align:left}
.chat-bubble th{background:var(--surface-elevated);color:var(--text);font-weight:600}
.chat-bubble code:not(pre code){background:var(--surface-elevated);color:var(--primary);padding:2px 6px;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:500}

/* Code Snippet Blocks */
.code-wrapper{
  margin:12px 0;
  border-radius:10px;
  background:#1e293b;
  border:1px solid #334155;
  overflow:hidden;
  color:#f8fafc;
}
.code-topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 14px;
  background:#0f172a;
  border-bottom:1px solid #334155;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:#94a3b8;
}
.mac-dots{
  display:flex;
  gap:5px;
}
.mac-dot{width:9px;height:9px;border-radius:50%}
.mac-dot.red{background:#ef4444}
.mac-dot.yellow{background:#f59e0b}
.mac-dot.green{background:#10b981}

.copy-code-btn{
  background:transparent;
  border:none;
  color:#94a3b8;
  cursor:pointer;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  padding:3px 8px;
  border-radius:4px;
  transition:all .15s;
}
.copy-code-btn:hover{color:#fff;background:rgba(255,255,255,0.1)}
.code-wrapper pre{margin:0;padding:14px;overflow-x:auto}
.code-wrapper pre code{font-family:'JetBrains Mono',monospace;font-size:12.5px;background:transparent!important}

/* Response Tag & Action Row */
.msg-info-row{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:2px;
  font-size:11px;
  color:var(--text-dim);
}
.engine-badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  background:var(--surface-elevated);
  padding:2px 8px;
  border-radius:6px;
  border:1px solid var(--border);
  font-weight:600;
  color:var(--text-muted);
}
.engine-badge.web{
  border-color:rgba(2, 132, 199, 0.3);
  color:var(--cyan);
}

.msg-actions-row{
  display:flex;
  gap:6px;
  margin-top:4px;
}
.act-btn{
  display:inline-flex;
  align-items:center;
  gap:4px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text-muted);
  font-size:11px;
  padding:3px 9px;
  border-radius:6px;
  cursor:pointer;
  transition:all .18s;
  box-shadow:var(--shadow-sm);
}
.act-btn:hover{
  background:var(--surface-elevated);
  border-color:var(--primary);
  color:var(--primary);
}
.act-btn.active{
  border-color:var(--cyan);
  color:var(--cyan);
}

/* Typing & Search Indicators */
.typing-box .chat-bubble{
  display:flex;
  align-items:center;
  gap:5px;
  padding:14px 18px;
  background:var(--surface);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-dim);animation:pulseSubtle 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}

.search-banner{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:var(--cyan);
  background:var(--cyan-subtle);
  border:1px solid rgba(2, 132, 199, 0.25);
  border-radius:8px;
  padding:7px 12px;
  margin-bottom:8px;
  animation:fadeScale .2s ease;
  font-weight:500;
}
.spinner{
  width:13px;
  height:13px;
  border:2px solid rgba(2, 132, 199, 0.2);
  border-top-color:var(--cyan);
  border-radius:50%;
  animation:spin 1s linear infinite;
}

/* BOTTOM INPUT BAR */
.input-section{
  padding:14px 20% 20px;
  background:transparent;
  flex-shrink:0;
  position:relative;
}
.input-box{
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:10px 14px;
  display:flex;
  align-items:flex-end;
  gap:10px;
  box-shadow:var(--shadow-md);
  transition:border-color .2s, box-shadow .2s;
}
.input-box:focus-within{
  border-color:var(--border-focus);
  box-shadow:0 0 0 3px rgba(79, 70, 229, 0.12), var(--shadow-md);
}
#user-textarea{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:14.5px;
  color:var(--text);
  resize:none;
  max-height:140px;
  min-height:26px;
  line-height:1.6;
}
#user-textarea::placeholder{color:var(--text-dim)}

.tool-btn{
  width:36px;
  height:36px;
  border-radius:10px;
  background:var(--surface-elevated);
  border:1px solid var(--border);
  color:var(--text-muted);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all .18s;
  flex-shrink:0;
}
.tool-btn:hover{
  border-color:var(--cyan);
  color:var(--cyan);
  background:var(--surface-hover);
}
.tool-btn.listening{
  background:rgba(239,68,68,0.15);
  border-color:#ef4444;
  color:#ef4444;
}

.submit-btn{
  width:36px;
  height:36px;
  border-radius:10px;
  background:var(--primary-gradient);
  border:none;
  color:#fff;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all .18s;
  flex-shrink:0;
  box-shadow:var(--shadow-sm);
}
.submit-btn:hover{
  transform:scale(1.05);
  box-shadow:var(--shadow-md);
}
.submit-btn:active{transform:scale(.95)}
.submit-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}

.stop-box{display:none;width:12px;height:12px;background:#fff;border-radius:2px}
.submit-btn.generating .send-icon{display:none}
.submit-btn.generating .stop-box{display:block}

.input-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:11px;
  color:var(--text-dim);
  margin-top:8px;
  padding:0 6px;
}

/* AUDIO WAVE EQUALIZER */
.audio-wave{
  display:none;
  align-items:center;
  gap:2px;
  height:14px;
}
.audio-wave.active{display:inline-flex}
.wave-bar{
  width:2px;
  height:10px;
  background:var(--cyan);
  border-radius:1px;
  animation:waveAnim 1s ease-in-out infinite;
}
.wave-bar:nth-child(2){animation-delay:.2s}
.wave-bar:nth-child(3){animation-delay:.4s}

/* MOBILE RESPONSIVE */
@media(max-width:860px){
  .sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
  }
  .sidebar.collapsed{
    transform:translateX(-100%);
    margin-left:0;
  }
  .chat-viewport{padding:16px 5%}
  .input-section{padding:10px 5% 16px}
  .feature-cards{grid-template-columns:1fr}
  .current-session-title{max-width:140px}
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <a href="#" class="brand">
      <div class="brand-icon">⚡</div>
      <div>
        <div class="brand-name">Nova AI</div>
      </div>
      <span class="brand-badge">PRO</span>
    </a>
    <button class="btn-icon" onclick="toggleSidebar()" title="Close sidebar">✕</button>
  </div>

  <div class="new-chat-container">
    <button class="new-chat-btn" onclick="createNewChat()">
      <span>+ New conversation</span>
      <span class="kbd-hint">Ctrl K</span>
    </button>
  </div>

  <div class="chat-history-label">Recent Chats</div>
  <div class="chat-history-list" id="chat-history-list"></div>

  <div class="sidebar-footer">
    <div class="status-indicator">
      <div class="status-dot"></div>
      <span>Engine Online</span>
    </div>
    <button class="clear-btn" onclick="clearAllHistory()">Clear all</button>
  </div>
</aside>

<!-- MAIN CONTENT -->
<main class="main-content">
  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="btn-icon" onclick="toggleSidebar()" title="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span class="current-session-title" id="session-title">New conversation</span>
    </div>

    <div class="topbar-right">
      <!-- Segmented Mode Switcher -->
      <div class="mode-switch">
        <button class="mode-btn turbo active" id="btn-turbo" onclick="setMode('turbo')">⚡ Turbo</button>
        <button class="mode-btn precision" id="btn-precision" onclick="setMode('precision')">🧠 Precision</button>
      </div>

      <!-- Live Web Search Toggle -->
      <button class="web-toggle" id="web-toggle" onclick="toggleWebSearch()" title="Toggle live web search">
        <span>🌐</span>
        <span id="web-status-text">Web Search</span>
      </button>

      <!-- Theme Switcher Toggle (Light / Dark) -->
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Switch Light/Dark Theme">
        <span id="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <!-- CHAT VIEWPORT -->
  <div class="chat-viewport" id="chat-viewport"></div>

  <!-- INPUT SECTION -->
  <div class="input-section">
    <div class="input-box">
      <!-- Voice Input -->
      <button class="tool-btn" id="mic-btn" onclick="toggleMic()" title="Voice input">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      </button>

      <!-- Auto Expanding Textarea -->
      <textarea id="user-textarea" rows="1" placeholder="Ask Nova anything..." onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>

      <!-- Submit / Stop Button -->
      <button class="submit-btn" id="submit-btn" onclick="handleSubmit()" title="Send">
        <svg class="send-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        <div class="stop-box"></div>
      </button>
    </div>

    <div class="input-footer">
      <span>ENTER to send · SHIFT+ENTER for newline</span>
      <span id="footer-mode-indicator">⚡ Turbo Engine · Instant Response</span>
    </div>
  </div>
</main>

<script>
  const STORAGE_KEY = 'nova_chat_v3';
  const THEME_KEY = 'nova_theme_pref';
  let currentTheme = localStorage.getItem(THEME_KEY) || 'light';
  let sessions = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let activeId = null;
  let activeMode = 'turbo';
  let webSearchOn = false;
  let isGenerating = false;
  let abortCtrl = null;
  let synth = window.speechSynthesis;
  let recognition = null;
  let isListening = false;

  // Apply Theme
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('theme-icon').textContent = theme === 'light' ? '🌙' : '☀️';
    localStorage.setItem(THEME_KEY, theme);
  }

  function toggleTheme(){
    currentTheme = currentTheme === 'light' ? 'dark' : 'light';
    applyTheme(currentTheme);
  }

  // Marked Configuration
  marked.setOptions({
    highlight: function(code, lang) {
      const language = hljs.getLanguage(lang) ? lang : 'plaintext';
      return hljs.highlight(code, { language }).value;
    },
    breaks: true,
    gfm: true
  });

  function saveSessions(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions)); }
  function getActiveSession(){ return sessions.find(s => s.id === activeId); }

  function toggleSidebar(){
    document.getElementById('sidebar').classList.toggle('collapsed');
  }

  function setMode(mode){
    activeMode = mode;
    document.getElementById('btn-turbo').classList.toggle('active', mode === 'turbo');
    document.getElementById('btn-precision').classList.toggle('active', mode === 'precision');
    document.getElementById('footer-mode-indicator').textContent = mode === 'turbo' 
      ? '⚡ Turbo Engine · Instant Response' 
      : '🧠 Precision Engine · Deep Intelligence';
  }

  function toggleWebSearch(){
    webSearchOn = !webSearchOn;
    const btn = document.getElementById('web-toggle');
    btn.classList.toggle('active', webSearchOn);
  }

  function createNewChat(){
    activeId = Date.now().toString();
    sessions.push({ id: activeId, title: 'New conversation', messages: [] });
    saveSessions();
    renderHistoryList();
    renderConversation([]);
    document.getElementById('session-title').textContent = 'New conversation';
    document.getElementById('user-textarea').focus();
    if(window.innerWidth <= 860) toggleSidebar();
  }

  function switchChat(id){
    activeId = id;
    const s = getActiveSession();
    renderHistoryList();
    renderConversation(s ? s.messages : []);
    document.getElementById('session-title').textContent = (s && s.title) ? s.title : 'Conversation';
    if(window.innerWidth <= 860) toggleSidebar();
  }

  function deleteChat(e, id){
    e.stopPropagation();
    sessions = sessions.filter(s => s.id !== id);
    saveSessions();
    if(activeId === id) createNewChat();
    else renderHistoryList();
  }

  function clearAllHistory(){
    if(confirm('Clear all conversation history?')){
      sessions = [];
      saveSessions();
      createNewChat();
    }
  }

  function renderHistoryList(){
    const list = document.getElementById('chat-history-list');
    list.innerHTML = '';
    if(!sessions.length){
      list.innerHTML = '<div style="font-size:12px;color:var(--text-dim);padding:12px 14px;font-style:italic;">No chats yet</div>';
      return;
    }
    [...sessions].reverse().forEach(s => {
      const item = document.createElement('div');
      item.className = 'history-item' + (s.id === activeId ? ' active' : '');
      item.innerHTML = `<span class="history-title">${escapeHtml(s.title || 'New chat')}</span><button class="history-del-btn" onclick="deleteChat(event, '${s.id}')">✕</button>`;
      item.onclick = (e) => { if(e.target.classList.contains('history-del-btn')) return; switchChat(s.id); };
      list.appendChild(item);
    });
  }

  function renderConversation(messages){
    const win = document.getElementById('chat-viewport');
    win.innerHTML = '';
    if(!messages || !messages.length){
      win.innerHTML = `<div class="welcome-hero" id="welcome-hero">
        <div class="hero-orb">⚡</div>
        <h1>How can I assist you today?</h1>
        <p>Ask anything — software engineering, complex questions, daily creative writing, or live world updates.</p>
        <div class="feature-cards">
          <div class="feature-card" onclick="quickPrompt('What are the newest technological and AI breakthroughs in 2026?')">
            <div class="feature-card-title">🌐 Live Web Updates</div>
            <div class="feature-card-desc">Ask about recent current events & live facts</div>
          </div>
          <div class="feature-card" onclick="quickPrompt('Write a clean, performant Python script to parse and stream JSON data')">
            <div class="feature-card-title">💻 Code & Architecture</div>
            <div class="feature-card-desc">Build, refactor, and debug production code</div>
          </div>
          <div class="feature-card" onclick="quickPrompt('Explain the core principles of quantum cryptography in simple terms')">
            <div class="feature-card-title">💡 Deep Intelligence</div>
            <div class="feature-card-desc">Break down complex scientific concepts</div>
          </div>
          <div class="feature-card" onclick="quickPrompt('Give me a 5-step daily routine for maximum developer productivity')">
            <div class="feature-card-title">🚀 Daily Strategy</div>
            <div class="feature-card-desc">Actionable frameworks and optimization</div>
          </div>
        </div>
      </div>`;
    } else {
      messages.forEach(m => addMessageRow(m.role, m.content, false, m.meta));
    }
    win.scrollTop = win.scrollHeight;
  }

  function formatMarkdown(content){
    try {
      const parsed = marked.parse(content);
      const parser = new DOMParser();
      const doc = parser.parseFromString(parsed, 'text/html');
      doc.querySelectorAll('pre').forEach(pre => {
        const code = pre.querySelector('code');
        const lang = (code && code.className) ? code.className.replace('language-', '') : 'code';
        const wrap = document.createElement('div');
        wrap.className = 'code-wrapper';
        wrap.innerHTML = `
          <div class="code-topbar">
            <div class="mac-dots"><div class="mac-dot red"></div><div class="mac-dot yellow"></div><div class="mac-dot green"></div></div>
            <span>${lang}</span>
            <button class="copy-code-btn" onclick="copyCode(this)">COPY</button>
          </div>`;
        pre.parentNode.insertBefore(wrap, pre);
        wrap.appendChild(pre);
      });
      return doc.body.innerHTML;
    } catch {
      return escapeHtml(content);
    }
  }

  function addMessageRow(role, text, save=true, meta=null){
    const hero = document.getElementById('welcome-hero');
    if(hero) hero.remove();

    const win = document.getElementById('chat-viewport');
    const row = document.createElement('div');
    row.className = `message-row ${role}`;

    const container = document.createElement('div');
    container.className = 'bubble-container';

    const bubble = document.createElement('div');
    bubble.className = 'chat-bubble';

    if(role === 'user'){
      bubble.textContent = text;
    } else {
      bubble.innerHTML = formatMarkdown(text);
    }
    container.appendChild(bubble);

    if(role === 'bot'){
      const infoRow = document.createElement('div');
      infoRow.className = 'msg-info-row';
      const modeLabel = (meta && meta.mode) ? meta.mode : (activeMode === 'turbo' ? 'Turbo Mode' : 'Precision Mode');
      infoRow.innerHTML = `<span class="engine-badge">${escapeHtml(modeLabel)}</span>`;
      if(meta && meta.searched){
        infoRow.innerHTML += `<span class="engine-badge web">🌐 Web Grounded</span>`;
      }
      container.appendChild(infoRow);

      const actions = document.createElement('div');
      actions.className = 'msg-actions-row';

      const copyBtn = document.createElement('button');
      copyBtn.className = 'act-btn';
      copyBtn.innerHTML = `📋 Copy`;
      copyBtn.onclick = () => copyText(copyBtn, text);

      const speakBtn = document.createElement('button');
      speakBtn.className = 'act-btn';
      speakBtn.innerHTML = `🔊 Speak <div class="audio-wave"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div>`;
      speakBtn.onclick = () => toggleSpeech(speakBtn, text);

      actions.appendChild(copyBtn);
      actions.appendChild(speakBtn);
      container.appendChild(actions);
    }

    row.innerHTML = `<div class="avatar-badge">${role === 'user' ? '👤' : '⚡'}</div>`;
    row.appendChild(container);
    win.appendChild(row);
    win.scrollTop = win.scrollHeight;

    if(save){
      const s = getActiveSession();
      if(s){
        s.messages.push({ role, content: text, meta });
        if(s.messages.length === 1 && role === 'user'){
          s.title = text.split(' ').slice(0, 5).join(' ') + (text.split(' ').length > 5 ? '…' : '');
          document.getElementById('session-title').textContent = s.title;
        }
        saveSessions();
        renderHistoryList();
      }
    }
    return bubble;
  }

  function showTyping(){
    const hero = document.getElementById('welcome-hero'); if(hero) hero.remove();
    const win = document.getElementById('chat-viewport');
    const row = document.createElement('div');
    row.className = 'message-row bot typing-box';
    row.id = 'typing-indicator';
    row.innerHTML = `<div class="avatar-badge">⚡</div><div class="chat-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    win.appendChild(row);
    win.scrollTop = win.scrollHeight;
  }
  function removeTyping(){
    const el = document.getElementById('typing-indicator');
    if(el) el.remove();
  }

  function showSearchNotice(){
    const win = document.getElementById('chat-viewport');
    const notice = document.createElement('div');
    notice.id = 'search-notice';
    notice.className = 'search-banner';
    notice.innerHTML = '<div class="spinner"></div><span>Browsing live web sources...</span>';
    win.appendChild(notice);
    win.scrollTop = win.scrollHeight;
  }
  function removeSearchNotice(){
    const el = document.getElementById('search-notice');
    if(el) el.remove();
  }

  function handleSubmit(){
    if(isGenerating){
      if(abortCtrl) abortCtrl.abort();
      setGenerating(false);
    } else {
      sendUserMessage();
    }
  }

  function setGenerating(generating){
    isGenerating = generating;
    const btn = document.getElementById('submit-btn');
    btn.classList.toggle('generating', generating);
  }

  async function sendUserMessage(){
    const input = document.getElementById('user-textarea');
    const message = input.value.trim();
    if(!message || isGenerating) return;

    input.value = '';
    input.style.height = 'auto';

    addMessageRow('user', message);
    showTyping();
    setGenerating(true);

    const s = getActiveSession();
    const history = s ? s.messages.slice(-8) : [];
    abortCtrl = new AbortController();

    try {
      const response = await fetch('/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: message,
          history: history,
          mode: activeMode,
          web_search: webSearchOn
        }),
        signal: abortCtrl.signal
      });

      removeTyping();

      if(!response.ok) throw new Error('Status: ' + response.status);

      const win = document.getElementById('chat-viewport');
      const row = document.createElement('div');
      row.className = 'message-row bot';
      const container = document.createElement('div');
      container.className = 'bubble-container';
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble';
      container.appendChild(bubble);
      row.innerHTML = '<div class="avatar-badge">⚡</div>';
      row.appendChild(container);
      win.appendChild(row);

      let accumulated = '';
      let searched = false;

      const reader = response.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';

      while(true){
        const { value, done } = await reader.read();
        if(done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n\n');
        buffer = lines.pop() || '';

        for(const line of lines){
          const trimmed = line.trim();
          if(!trimmed.startsWith('data:')) continue;
          const dataStr = trimmed.replace(/^data:\s*/, '');
          if(dataStr === '[DONE]') continue;

          try {
            const parsed = JSON.parse(dataStr);
            if(parsed.meta){
              showSearchNotice();
              searched = true;
            }
            if(parsed.content){
              removeSearchNotice();
              accumulated += parsed.content;
              bubble.innerHTML = formatMarkdown(accumulated);
              win.scrollTop = win.scrollHeight;
            }
          } catch {
            accumulated += dataStr;
            bubble.innerHTML = formatMarkdown(accumulated);
            win.scrollTop = win.scrollHeight;
          }
        }
      }

      removeSearchNotice();

      if(!accumulated.trim()){
        accumulated = "I'm ready. How else can I assist you?";
        bubble.textContent = accumulated;
      }

      const meta = { searched, mode: activeMode === 'turbo' ? 'Turbo Mode' : 'Precision Mode' };
      const infoRow = document.createElement('div');
      infoRow.className = 'msg-info-row';
      infoRow.innerHTML = `<span class="engine-badge">${meta.mode}</span>`;
      if(searched) infoRow.innerHTML += `<span class="engine-badge web">🌐 Web Grounded</span>`;
      container.appendChild(infoRow);

      const actions = document.createElement('div');
      actions.className = 'msg-actions-row';

      const copyBtn = document.createElement('button');
      copyBtn.className = 'act-btn';
      copyBtn.innerHTML = `📋 Copy`;
      copyBtn.onclick = () => copyText(copyBtn, accumulated);

      const speakBtn = document.createElement('button');
      speakBtn.className = 'act-btn';
      speakBtn.innerHTML = `🔊 Speak <div class="audio-wave"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div>`;
      speakBtn.onclick = () => toggleSpeech(speakBtn, accumulated);

      actions.appendChild(copyBtn);
      actions.appendChild(speakBtn);
      container.appendChild(actions);

      if(s){
        s.messages.push({ role: 'bot', content: accumulated, meta });
        saveSessions();
      }

    } catch (err) {
      removeTyping();
      removeSearchNotice();
      if(err.name !== 'AbortError'){
        try {
          const fb = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message, history: history, mode: activeMode, web_search: webSearchOn })
          });
          const data = await fb.json();
          addMessageRow('bot', data.reply || 'I am ready. Please re-send.', true, { searched: data.searched, mode: data.mode });
        } catch {
          addMessageRow('bot', 'Service is connecting. Please retry in a few moments.', false);
        }
      }
    } finally {
      setGenerating(false);
      input.focus();
    }
  }

  function copyText(btn, text){
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = '✓ Copied';
      setTimeout(() => { btn.textContent = '📋 Copy'; }, 2000);
    });
  }

  function copyCode(btn){
    const code = btn.closest('.code-wrapper').querySelector('pre code');
    if(code){
      navigator.clipboard.writeText(code.innerText).then(() => {
        btn.textContent = 'COPIED!';
        setTimeout(() => { btn.textContent = 'COPY'; }, 2000);
      });
    }
  }

  function toggleSpeech(btn, text){
    const wave = btn.querySelector('.audio-wave');
    if(synth && synth.speaking){
      synth.cancel();
      if(btn.classList.contains('speaking')){
        btn.classList.remove('speaking');
        wave.classList.remove('active');
        return;
      }
    }
    const clean = text.replace(/```[\s\S]*?```/g, 'Code block omitted.');
    const utt = new SpeechSynthesisUtterance(clean);
    utt.rate = 1.0;
    utt.onend = () => {
      btn.classList.remove('speaking');
      wave.classList.remove('active');
    };
    btn.classList.add('speaking');
    wave.classList.add('active');
    synth.speak(utt);
  }

  function toggleMic(){
    const btn = document.getElementById('mic-btn');
    const input = document.getElementById('user-textarea');
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){
      alert('Speech recognition is supported in Chrome & Edge browsers.');
      return;
    }
    if(isListening){
      recognition.stop();
      return;
    }
    recognition = new SR();
    recognition.lang = 'en-US';
    recognition.interimResults = true;
    recognition.onstart = () => {
      isListening = true;
      btn.classList.add('listening');
      input.placeholder = 'Listening...';
    };
    recognition.onresult = (e) => {
      input.value = Array.from(e.results).map(r => r[0].transcript).join('');
      autoResize(input);
    };
    recognition.onend = () => {
      isListening = false;
      btn.classList.remove('listening');
      input.placeholder = 'Ask Nova anything...';
      if(input.value.trim()) sendUserMessage();
    };
    recognition.onerror = () => {
      isListening = false;
      btn.classList.remove('listening');
      input.placeholder = 'Ask Nova anything...';
    };
    recognition.start();
  }

  function autoResize(el){
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  function handleKeyDown(e){
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendUserMessage();
    }
  }

  function quickPrompt(text){
    document.getElementById('user-textarea').value = text;
    sendUserMessage();
  }

  // Ctrl+K Shortcut for New Chat
  document.addEventListener('keydown', (e) => {
    if((e.ctrlKey || e.metaKey) && e.key === 'k'){
      e.preventDefault();
      createNewChat();
    }
  });

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  window.addEventListener('load', () => {
    applyTheme(currentTheme);
    if(sessions.length > 0){
      switchChat(sessions[sessions.length - 1].id);
    } else {
      createNewChat();
    }
  });
</script>
